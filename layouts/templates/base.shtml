<!DOCTYPE html>
<html lang="en">
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title :text="$page.title.suffix(' | ', $site.title)"></title>
		<meta name="description" content="$page.description">
		<link rel="canonical" href="$site.host_url.addPath($page.link())">
		<meta property="og:site_name" content="$site.title">
		<meta property="og:title" content="$page.title">
		<meta property="og:description" content="$page.description">
		<meta property="og:url" content="$site.host_url.addPath($page.link())">
		<meta name="theme-color" id="theme-color-meta" content="#24273a">
		<script>
			(function () {
				// Runs before CSS loads, so these mirror --ctp-base.
				var THEME_COLORS = { light: "#eff1f5", dark: "#24273a" };
				var theme = null;
				try { theme = localStorage.getItem("theme"); } catch (e) {}
				if (theme !== "light" && theme !== "dark") {
					theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
						? "light" : "dark";
				}
				document.documentElement.setAttribute("data-theme", theme);
				document.getElementById("theme-color-meta").setAttribute("content", THEME_COLORS[theme]);
			})();
		</script>
		<link rel="icon" href="$site.asset('favicon.ico').link()" sizes="32x32">
		<link rel="icon" href="$site.asset('favicon.svg').link()" type="image/svg+xml">
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<link type="text/css" rel="stylesheet" href="$site.asset('highlight.css').link()">
		<link rel="alternate" type="application/rss+xml" title="$site.title" href="$site.page('blog').alternative('rss').link()">
		<!-- mathtex: opt in per page with .custom = { "math": true } -->
		<ctx :if="$page.custom.get?('math')">
			<link type="text/css" rel="stylesheet" href="$site.asset('Temml-Local.css').link()">
			<script defer src="$site.asset('temml.min.js').link()"></script>
			<script defer src="$site.asset('render-mathtex.js').link()"></script>
		</ctx>
		<super>
	</head>
	<body>
		<div class="progress-bar" id="progress-bar"></div>
		<header>
			<p class="site-title">
				<a href="$site.page('').link()" :text="$site.title"></a><span class="cursor">_</span>
			</p>
			<p class="site-tagline">Cache-friendly reads, user-hostile writes.</p>
			<nav>
				<a href="$site.page('').link()">home</a>
				<a href="$site.page('blog').link()">blog</a>
				<a href="$site.page('about').link()">about</a>
				<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
					<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
					<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
				</button>
			</nav>
		</header>
		<main id="main">
			<super>
		</main>
		<footer>
			<div class="footer-row">
				<span :text="$site.title"></span>
				<a href="$site.page('blog').alternative('rss').link()">RSS</a>
			</div>
			<div class="footer-row">
				<span class="build-flags" id="quip"></span>
				<span class="cycle-counter" aria-hidden="true" title="not a real metric, just a little odometer that ticks up while this tab is open. click for a boost.">
					<span class="led"></span>cycles burned: <span id="cycle-count">0</span>
				</span>
			</div>
		</footer>
		<script>
			(function () {
				var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

				var quips = [
					"-O3 -march=native",
					"AVX-512 heated my room today",
					"this text is guaranteed to be thread-safe",
					"it's not a memory leak, it's a long-lived cache",
					"premature optimization is the root of all fun",
					"perf stat says it's fine",
					"01101000 01101001",
					"measured twice, optimized once",
					"this footer was branch-predicted correctly",
					"compiling... compiling... compiling...",
					"please don't profile the footer",
					"this comment is O(1)",
					"warning: footer may contain undefined behavior",
					"thanks for scrolling all the way down here",
					"now with 30% fewer cache misses",
					"hand-tuned, mostly by accident",
					"running on vibes and L1 cache"
				];
				var el = document.getElementById("quip");
				if (el) el.textContent = quips[Math.floor(Math.random() * quips.length)];

				// Copy button for code blocks.
				document.querySelectorAll("pre > code").forEach(function (codeEl) {
					var pre = codeEl.parentElement;

					var wrap = document.createElement("div");
					wrap.className = "code-block";
					if (codeEl.className) wrap.setAttribute("data-lang", codeEl.className);
					pre.parentNode.insertBefore(wrap, pre);
					wrap.appendChild(pre);

					var btn = document.createElement("button");
					btn.type = "button";
					btn.className = "copy-btn";
					btn.textContent = "copy";
					btn.setAttribute("aria-label", "Copy code to clipboard");
					btn.addEventListener("click", function () {
						var text = codeEl.textContent;
						var done = function () {
							btn.textContent = "copied!";
							btn.classList.add("copied");
							var r = btn.getBoundingClientRect();
							spawnSparks(r.left + r.width / 2, r.top + r.height / 2, 12, "--ctp-green");
							clearTimeout(btn._resetTimer);
							btn._resetTimer = setTimeout(function () {
								btn.textContent = "copy";
								btn.classList.remove("copied");
							}, 1600);
						};
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard.writeText(text).then(done, done);
						} else {
							var ta = document.createElement("textarea");
							ta.value = text;
							ta.style.position = "fixed";
							ta.style.opacity = "0";
							document.body.appendChild(ta);
							ta.select();
							try { document.execCommand("copy"); } catch (err) {}
							document.body.removeChild(ta);
							done();
						}
					});
					wrap.appendChild(btn);
				});

				// Game feel: one-shot tweens on the individual rotate/scale/translate
				// properties, so they stack on top of CSS hover/active transforms.
				function juice(el, keyframes, ms) {
					if (reducedMotion || !el || !el.animate) return;
					el.animate(keyframes, { duration: ms, easing: "ease-out" });
				}
				var POP = [{ scale: "0.85" }, { scale: "1.12" }, { scale: "1" }];
				var PUNCH = [{ scale: "1" }, { scale: "1.35" }, { scale: "1" }];
				var SHAKE = [
					{ translate: "0 0" }, { translate: "-3px 0" }, { translate: "3px 0" },
					{ translate: "-2px 0" }, { translate: "2px 0" }, { translate: "0 0" }
				];
				var SPIN_IN = [{ rotate: "-120deg", scale: "0.4" }, { rotate: "0deg", scale: "1" }];
				var PRESSABLE = ".site-title a, nav a, .theme-toggle, .copy-btn, .post-entry .title, #prev-next a, footer a, .cycle-counter";

				// Size hover tilt/grow and press squash so every element's edges move
				// about as far as the theme toggle's: icons swing, titles barely rotate.
				function feel(el) {
					var w = el.offsetWidth || 16;
					var dir = Math.random() < 0.5 ? -1 : 1;
					el.style.setProperty("--tilt", dir * Math.min(15, Math.max(0.75, 240 / w)) + "deg");
					el.style.setProperty("--grow", 1 + Math.min(0.2, Math.max(0.02, 3.2 / w)));
					el.style.setProperty("--squash", Math.max(0.85, Math.min(0.97, 1 - 2.4 / w)));
				}

				// Light/dark theme toggle, persisted to localStorage.
				var toggle = document.getElementById("theme-toggle");
				if (toggle) {
					toggle.addEventListener("click", function () {
						var root = document.documentElement;
						var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
						root.setAttribute("data-theme", next);
						try { localStorage.setItem("theme", next); } catch (e) {}
						document.getElementById("theme-color-meta")
							.setAttribute("content", getComputedStyle(root).backgroundColor);
						toggle.querySelectorAll("svg").forEach(function (icon) {
							juice(icon, SPIN_IN, 350);
						});
					});
				}

				// Pick a random accent for the post drop cap each load.
				var dropcapColors = [
					"--ctp-red", "--ctp-peach", "--ctp-yellow", "--ctp-green",
					"--ctp-teal", "--ctp-blue", "--ctp-mauve", "--ctp-pink"
				];
				var pick = dropcapColors[Math.floor(Math.random() * dropcapColors.length)];
				document.documentElement.style.setProperty("--dropcap-color", "var(" + pick + ")");

				// Scroll progress bar.
				var progressBar = document.getElementById("progress-bar");
				function updateProgress() {
					if (!progressBar) return;
					var scrollTop = window.scrollY || document.documentElement.scrollTop;
					var max = document.documentElement.scrollHeight - window.innerHeight;
					var pct = max > 0 ? scrollTop / max : 0;
					progressBar.style.transform =
						"scaleX(" + Math.min(1, Math.max(0, pct)) + ")";
				}
				document.addEventListener("scroll", updateProgress, { passive: true });
				window.addEventListener("resize", updateProgress);
				requestAnimationFrame(updateProgress);

				// "Cycles burned" odometer. Pauses when the tab isn't visible.
				var cycleEl = document.getElementById("cycle-count");
				var cycleCounter = document.querySelector(".cycle-counter");
				if (cycleEl) {
					var targetCount = Math.floor(1e9 + Math.random() * 8e9);
					var count = 0;
					var timer = null;
					var boost = 1;
					var tick = function () {
						count += Math.floor((2200000 + Math.random() * 900000) * boost);
						cycleEl.textContent = count.toLocaleString("en-US");
					};
					var start = function () {
						if (!timer) {
							tick();
							timer = setInterval(tick, 80);
						}
					};
					var stop = function () {
						if (timer) {
							clearInterval(timer);
							timer = null;
						}
					};
					document.addEventListener("visibilitychange", function () {
						if (document.hidden) stop(); else start();
					});

					// On load: rev up from 0 to the starting value, then idle
					// normally. One-shot, doesn't repeat while reading.
					if (!reducedMotion) {
						if (cycleCounter) cycleCounter.classList.add("overclock");
						var step = Math.ceil(targetCount / 24);
						var bootTimer = setInterval(function () {
							count += step;
							if (count >= targetCount) {
								count = targetCount;
								clearInterval(bootTimer);
								if (cycleCounter) cycleCounter.classList.remove("overclock");
								if (!document.hidden) start();
							}
							cycleEl.textContent = count.toLocaleString("en-US");
						}, 35);
					} else {
						count = targetCount;
						cycleEl.textContent = count.toLocaleString("en-US");
						if (!document.hidden) start();
					}

					// Click the counter for a brief, purely cosmetic overclock.
					if (cycleCounter) {
						var overclockTimer = null;
						cycleCounter.addEventListener("click", function () {
							juice(cycleEl, PUNCH, 300);
							juice(cycleCounter, SHAKE, 300);
							boost = 16;
							cycleCounter.classList.add("overclock");
							clearTimeout(overclockTimer);
							overclockTimer = setTimeout(function () {
								boost = 1;
								cycleCounter.classList.remove("overclock");
							}, 2200);
						});
					}
				}

				// Click sparks. Skipped if the user prefers reduced motion.
				var sparkColors = [
					"--ctp-red", "--ctp-peach", "--ctp-yellow", "--ctp-green",
					"--ctp-teal", "--ctp-blue", "--ctp-mauve", "--ctp-pink", "--ctp-sapphire"
				];
				function spawnSparks(x, y, count, color) {
					if (reducedMotion) return;
					for (var i = 0; i < count; i++) {
						var s = document.createElement("span");
						s.className = "spark";
						var c = color || sparkColors[Math.floor(Math.random() * sparkColors.length)];
						s.style.background = "var(" + c + ")";
						s.style.left = x + "px";
						s.style.top = y + "px";
						var angle = Math.random() * Math.PI * 2;
						var dist = 24 + Math.random() * 50;
						s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
						s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
						s.style.setProperty("--spin", Math.floor(Math.random() * 360) + "deg");
						document.body.appendChild(s);
						s.addEventListener("animationend", function () {
							this.remove();
						});
					}
				}

				document.addEventListener("click", function (e) {
					var t = e.target.closest && e.target.closest(PRESSABLE);
					if (t) juice(t, POP, 260);
					// Keyboard activation has no pointer position (detail === 0)
					if (e.detail) {
						spawnSparks(e.clientX, e.clientY, 6 + Math.floor(Math.random() * 4));
					} else if (t) {
						var r = t.getBoundingClientRect();
						spawnSparks(r.left + r.width / 2, r.top + r.height / 2, 8);
					}
				});

				// Hovering a control tilts it (via CSS) with a tiny (quieter) spark.
				// Touch has no hover, so size the press squash on touch-down.
				document.addEventListener("pointerdown", function (e) {
					if (e.pointerType === "mouse") return;
					var t = e.target.closest && e.target.closest(PRESSABLE);
					if (t) feel(t);
				});
				document.addEventListener("pointerover", function (e) {
					if (e.pointerType !== "mouse") return;
					var t = e.target.closest && e.target.closest(PRESSABLE + ", [class^='tag-']");
					if (!t || (e.relatedTarget && t.contains(e.relatedTarget))) return;
					feel(t);
					var r = t.getBoundingClientRect();
					spawnSparks(r.left + r.width / 2, r.top + r.height / 2, 2);
				});

				// ---- Page-open intro. Runs once, settles within ~1s, then
				// the page goes quiet: no ongoing ambient effects while
				// someone is actually reading.
				if (!reducedMotion) {
					// Progress bar does a quick full sweep, then settles back
					// to wherever the actual scroll position is.
					if (progressBar) {
						progressBar.classList.add("boot");
						progressBar.addEventListener("animationend", function handler() {
							progressBar.classList.remove("boot");
							progressBar.style.opacity = "";
							updateProgress();
							progressBar.removeEventListener("animationend", handler);
						});
					}

					// Title "decrypts" from glitch characters into its real text.
					var titleLink = document.querySelector(".site-title a");
					if (titleLink) {
						var finalTitle = titleLink.textContent;
						var glitchChars = "01<>{}#/_!@$%&*^~".split("");
						var frame = 0;
						var totalFrames = 14;
						var decryptTimer = setInterval(function () {
							frame++;
							var revealed = Math.floor((frame / totalFrames) * finalTitle.length);
							var out = "";
							for (var i = 0; i < finalTitle.length; i++) {
								if (i < revealed || finalTitle[i] === " ") {
									out += finalTitle[i];
								} else {
									out += glitchChars[Math.floor(Math.random() * glitchChars.length)];
								}
							}
							titleLink.textContent = out;
							if (frame >= totalFrames) {
								clearInterval(decryptTimer);
								titleLink.textContent = finalTitle;
							}
						}, 40);
					}
				}

			})();
		</script>
	</body>
</html>
