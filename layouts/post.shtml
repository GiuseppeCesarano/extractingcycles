<extend template="base.shtml">
<head id="head">
	<meta property="og:type" content="article">
</head>
<main id="main">
	<article class="post">
		<h1 :text="$page.title"></h1>
		<p class="post-meta">
			<time :text="$page.date.format('2006-01-02')"></time>
			<span class="post-authors">
				by <span class="post-author" :loop="$page.authors" :text="$loop.it"></span>
			</span>
		</p>
		<div class="post-body" :html="$page.content()"></div>
	</article>
	<div id="prev-next">
		<ctx :if="$page.prevPage?()">
			<div class="prev"><a href="$if.link()" :text="$if.title"></a></div>
		</ctx>
		<ctx :if="$page.nextPage?()">
			<div class="next"><a href="$if.link()" :text="$if.title"></a></div>
		</ctx>
	</div>
</main>
